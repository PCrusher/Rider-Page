name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, zip, pdo_sqlite, mbstring, curl
      - name: Syntax check
        run: find . -name '*.php' -not -path './docs/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests
        run: php tests/run.php
